<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAZA CEIDG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], } 
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f4f8;
            background-image: 
                radial-gradient(at 0% 0%, hsla(217,100%,94%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(253,100%,94%,1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(217,100%,91%,1) 0, transparent 50%), 
                radial-gradient(at 0% 100%, hsla(213,100%,95%,1) 0, transparent 50%);
            background-attachment: fixed;
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        body.no-scroll { overflow: hidden; }
    </style>
</head>
<body class="min-h-screen antialiased text-slate-800 transition-colors duration-300">

    <!-- ========================================== -->
    <!-- OVERLAY ŁADOWANIA -->
    <!-- ========================================== -->
    <div id="fullScreenLoader" class="hidden fixed inset-0 z-50 flex-col items-center justify-center bg-slate-900/40 backdrop-blur-md transition-opacity duration-300">
        <div class="relative flex justify-center items-center mb-6">
            <div class="absolute inline-flex h-20 w-20 rounded-full border-4 border-blue-400 opacity-20 animate-ping"></div>
            <div class="absolute inline-flex h-16 w-16 rounded-full border-4 border-t-blue-500 border-r-transparent border-b-indigo-500 border-l-transparent animate-spin"></div>
            <div class="inline-flex h-10 w-10 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 animate-pulse shadow-lg shadow-blue-500/50"></div>
        </div>
        <h3 class="text-2xl font-bold text-white tracking-wide shadow-black/50 drop-shadow-md">
            Autoryzacja...
        </h3>
        <p class="text-blue-100 font-medium mt-2 animate-pulse drop-shadow-md">
            Proszę czekać, pobieram dane z bazy KAS
        </p>
    </div>
    <!-- ========================================== -->

    <div class="max-w-5xl mx-auto pt-16 pb-20 px-5 relative z-10">
        
        <!-- NAGŁÓWEK (Poprawione pozycjonowanie i wysokość tekstu) -->
        <header class="text-center mb-14 relative z-10">
            <div class="inline-flex items-center gap-2 rounded-full bg-white/80 px-4 py-2 text-xs font-extrabold text-indigo-700 mb-5 shadow-sm border border-indigo-100 uppercase tracking-widest backdrop-blur-sm">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-indigo-500"></span>
                </span>
                Live API Connection
            </div>
            
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 via-blue-800 to-indigo-900 mb-4 pb-2 leading-tight">
                Portal Weryfikacji Podmiotów
            </h1>
            
            <p class="text-slate-600 max-w-2xl mx-auto font-medium text-lg">
                Oficjalne i darmowe zapytania do <span class="text-blue-700 font-bold">Białej Listy Podatników VAT</span>.
            </p>
        </header>

        <!-- PANEL WYSZUKIWANIA -->
        <div class="glass-card p-8 rounded-3xl shadow-xl shadow-indigo-100/50 mb-12 relative overflow-hidden">
            <div class="absolute -top-16 -right-16 w-48 h-48 bg-gradient-to-bl from-blue-100 to-transparent rounded-full opacity-60"></div>
            
            <form id="searchForm" class="relative z-10 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Kryterium</label>
                        <select id="searchType" class="w-full border-0 bg-white shadow-sm ring-1 ring-slate-200 rounded-2xl p-4 focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow font-semibold text-slate-700 cursor-pointer hover:ring-slate-300">
                            <option value="nip">Numer NIP</option>
                            <option value="regon">Numer REGON</option>
                        </select>
                    </div>
                    
                    <div class="md:col-span-8">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Identyfikator</label>
                        <div class="relative">
                            <input type="text" id="searchQuery" placeholder="Wprowadź ciąg cyfr..." required 
                               class="w-full border-0 bg-white shadow-sm ring-1 ring-slate-200 rounded-2xl p-4 pl-5 focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow text-slate-900 font-bold text-lg placeholder:font-normal placeholder:text-slate-400 hover:ring-slate-300">
                        </div>
                    </div>
                </div>
                
                <div class="flex justify-end pt-2">
                    <button type="submit" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 px-10 rounded-2xl shadow-lg shadow-indigo-500/30 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/40 w-full md:w-auto flex justify-center items-center gap-3 cursor-pointer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        Wyszukaj w bazie
                    </button>
                </div>
            </form>
        </div>

        <!-- POJEMNIK NA WYNIKI -->
        <div id="resultsContainer" class="hidden">
            <div id="resultsContent" class="hidden animate-fade-up"></div>
        </div>
    </div>

    <script>
        // Funkcja formatująca numer rachunku na format: xx xxxx xxxx xxxx xxxx xxxx xxxx
        function formatBankAccount(accountStr) {
            const clean = accountStr.replace(/\D/g, ''); // zostaw same cyfry
            if (clean.length === 26) {
                return `${clean.slice(0,2)} ${clean.slice(2,6)} ${clean.slice(6,10)} ${clean.slice(10,14)} ${clean.slice(14,18)} ${clean.slice(18,22)} ${clean.slice(22,26)}`;
            }
            return accountStr; // jeśli długość jest inna, zwróć oryginał
        }

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const searchType = document.getElementById('searchType').value;
            const searchQuery = document.getElementById('searchQuery').value.replace(/\D/g, ''); 
            
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsContent = document.getElementById('resultsContent');
            const overlay = document.getElementById('fullScreenLoader');
            
            document.body.classList.add('no-scroll');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            resultsContent.classList.add('hidden');

            try {
                if (searchType === 'nip' && searchQuery.length !== 10) {
                    throw new Error("Nieprawidłowy format! Numer NIP musi składać się z dokładnie 10 cyfr.");
                }
                if (searchType === 'regon' && (searchQuery.length !== 9 && searchQuery.length !== 14)) {
                    throw new Error("Nieprawidłowy format! Numer REGON musi składać się z 9 lub 14 cyfr.");
                }

                const today = new Date().toISOString().split('T')[0];
                const apiUrl = `https://wl-api.mf.gov.pl/api/search/${searchType}/${searchQuery}?date=${today}`;

                let response;
                try {
                    response = await fetch(apiUrl);
                } catch (fetchError) {
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`;
                    response = await fetch(proxyUrl);
                }

                if (!response.ok) {
                    throw new Error("Odmowa dostępu do bazy lub błąd po stronie serwerów Ministerstwa Finansów.");
                }

                const responseData = await response.json();

                if (!responseData.result || !responseData.result.subject) {
                    throw new Error("Podmiot nie figuruje w wykazie czynnych podatników VAT na dzień dzisiejszy.");
                }

                await new Promise(resolve => setTimeout(resolve, 1200));

                const subject = responseData.result.subject;
                renderResults(subject, responseData.result.requestDateTime);
                
                resultsContainer.classList.remove('hidden');
                resultsContent.classList.remove('hidden');
            } catch (error) {
                await new Promise(resolve => setTimeout(resolve, 800));

                resultsContainer.classList.remove('hidden');
                resultsContent.innerHTML = `
                <div class="bg-red-50/90 backdrop-blur-sm p-8 rounded-3xl border border-red-200 shadow-xl shadow-red-100/50 flex flex-col md:flex-row items-center gap-6 animate-fade-up"> 
                    <div class="bg-red-100 p-4 rounded-full text-red-600 shrink-0">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <div>
                        <h4 class="text-xl font-bold text-red-800 mb-1">Weryfikacja nie powiodła się</h4>
                        <p class="text-red-700 font-medium">${error.message}</p>
                    </div>
                </div>`;
                resultsContent.classList.remove('hidden');
            } finally {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                document.body.classList.remove('no-scroll');
            }
        });

        function renderResults(subject, fetchTime) {
            const resultsContent = document.getElementById('resultsContent');
            
            const address = subject.workingAddress || subject.residenceAddress || '<span class="text-slate-400 italic">Brak adresu w kartotece</span>';
            const krs = subject.krs || '<span class="text-slate-400 italic">Brak (JDG / Spółka Cywilna)</span>';
            const isVatActive = subject.statusVat === 'Czynny';
            const vatBadgeColor = isVatActive ? 'bg-emerald-500 text-white shadow-emerald-500/40' : 'bg-slate-400 text-white shadow-slate-400/40';

            const iconNip = '<svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 012-2h2a2 2 0 012 2v1m-6 0a2 2 0 002 2h2a2 2 0 002-2m-6 0V5a2 2 0 012-2h2a2 2 0 012 2v1"></path></svg>';
            const iconAddress = '<svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>';
            const iconBank = '<svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>';

            let accountsHtml = '';
            if (subject.accountNumbers && subject.accountNumbers.length > 0) {
                const accountsItems = subject.accountNumbers.map(acc => `
                    <div class="flex items-center gap-3 p-4 bg-white rounded-xl border border-slate-100 shadow-sm">
                        <div class="bg-indigo-50 p-2 rounded-lg shrink-0">${iconBank}</div>
                        <span class="font-mono text-slate-700 tracking-wider font-bold text-sm md:text-base">${formatBankAccount(acc)}</span>
                    </div>
                `).join('');
                
                accountsHtml = `
                    <div class="md:col-span-2 mt-2">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                            Rachunki bankowe z białej listy
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${accountsItems}
                        </div>
                    </div>
                `;
            } else {
                accountsHtml = `
                    <div class="md:col-span-2 mt-2">
                         <div class="p-4 bg-orange-50 text-orange-700 rounded-xl border border-orange-100 flex items-center gap-3 font-medium text-sm">
                            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                            Podmiot nie posiada zarejestrowanych rachunków rozliczeniowych.
                         </div>
                    </div>
                `;
            }

            resultsContent.innerHTML = `
                <div class="glass-card rounded-3xl shadow-2xl shadow-indigo-100 border border-white overflow-hidden">
                    
                    <div class="p-8 md:p-10 border-b border-slate-100 bg-white/40 relative overflow-hidden">
                        <div class="absolute -right-20 -top-20 w-64 h-64 bg-indigo-50 rounded-full blur-3xl opacity-60"></div>
                        
                        <div class="relative z-10 flex flex-col md:flex-row md:justify-between md:items-start gap-4">
                            <div>
                                <p class="text-sm font-bold text-indigo-600 mb-2 tracking-wider uppercase">Karta Podmiotu</p>
                                <h2 class="text-2xl md:text-4xl font-extrabold text-slate-900 leading-tight">${subject.name}</h2>
                            </div>
                            
                            <div class="shrink-0 mt-2 md:mt-0">
                                <span class="inline-flex items-center rounded-xl ${vatBadgeColor} px-4 py-2 text-sm font-bold shadow-lg">
                                    Podatnik VAT: ${subject.statusVat}
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-8 md:p-10 grid grid-cols-1 md:grid-cols-2 gap-10">
                        
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                ${iconNip} Numery Rejestrowe
                            </h3>
                            <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-4">
                                ${renderRow('Numer NIP', subject.nip)}
                                ${renderRow('Numer REGON', subject.regon)}
                                ${renderRow('Numer KRS', krs)}
                            </div>
                        </div>
                        
                        <div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                ${iconAddress} Siedziba
                            </h3>
                            <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm h-[calc(100%-2rem)] flex flex-col justify-center">
                                <span class="text-sm text-slate-400 font-medium mb-1">Adres z rejestru:</span>
                                <span class="text-lg font-bold text-slate-800 leading-snug">${address}</span>
                            </div>
                        </div>
                        
                        ${accountsHtml}
                    </div>
                    
                    <div class="px-8 py-5 bg-slate-900 text-slate-400 text-xs md:text-sm flex flex-col md:flex-row justify-between items-center gap-3 rounded-b-3xl">
                        <span class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Dane pobrane bezpośrednio z API Ministerstwa Finansów
                        </span>
                        <span class="font-mono text-slate-500">${fetchTime}</span>
                    </div>
                </div>
            `;
        }

        function renderRow(label, value) {
            return `
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                    <span class="text-sm text-slate-500 font-medium mb-1 sm:mb-0">${label}</span>
                    <span class="text-base font-bold text-slate-900">${value}</span>
                </div>
            `;
        }
    </script>
</body>
</html>
